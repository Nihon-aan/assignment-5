<body class="bg-[#F8FAFC] min-h-screen">

  <nav
    class="bg-white border-b border-[#E9E9E9] px-4 py-4 md:px-20 flex flex-col gap-4 md:flex-row md:items-center md:justify-between mb-[60px]">
    <a href="#" class="flex items-center gap-1 text-2xl font-semibold text-[#1F2937]">
      <img class="w-9" src="B13-A5-Github-Issue-Tracker/assets/github-logo.png" alt="GitHub logo">
      GitHub Issues Tracker
    </a>

    <div class="flex gap-4">
      <label class="input h-11 w-full md:w-[300px] rounded border-[#E4E4E7] gap-1">
        <i class="fa-solid fa-magnifying-glass text-sm"></i>
        <input id="search" type="search" class="grow" placeholder="Search issues..." />
      </label>

      <button id="search-btn" class="btn h-11 rounded border-none text-white font-semibold bg-[#4A00FF]">
        <i class="fa-solid fa-plus"></i> New Issue
      </button>
    </div>
  </nav>


  <main class="max-w-[1100px] mx-auto">




    <section class="options bg-white p-6   rounded-lg shadow-sm">
      <button id="allBtn" class="btn bg-white font-semibold text-[#64748B] w-[120px] h-[40px]">All</button>
      <button id="openBtn" class="btn bg-white font-semibold text-[#64748B] w-[120px] h-[40px]">Open</button>
      <button id="closedBtn" class="btn bg-white font-semibold text-[#64748B] w-[120px] h-[40px]">Closed</button>
    </section>


    <section class=" items-container bg-white  mt-4  rounded-lg">


      <section class="status-section p-6 flex justify-between border-b-2 border-[#E4E4E7]">


        <div class="left-status flex gap-2 items-center">


          <div class="aperturer-logo h-[50px] w-[50px] flex justify-center items-center bg-[#ECE4FF] rounded-full"><img
              src="B13-A5-Github-Issue-Tracker/assets/Aperture.png" class="" alt=""></div>

          <div class="issue-count">
            <h2 class="font-semibold text-[20px] text-[#1F2937]">50 Issues</h2>
            <p class="text-[16px] text-[#64748B]">Track and manage your project issues</p>
          </div>



        </div>


        <div class="right-status flex gap-4 items-center justify-center">

          <div class="open-status flex justify-center items-center gap-2">
            <div class="green-logo h-3 w-3 bg-[#00A96E] rounded-full">
            </div>
            <p>Open</p>

          </div>

          <div class="closed-status flex justify-center items-center gap-2">
            <div class="green-logo h-3 w-3 bg-[#A855F7] rounded-full">
            </div>
            <p>Closed</p>

          </div>
        </div>

      </section>



      <section id="cards-container" class="cards-container p-6 bg-[#FBFBFB] flex flex-wrap justify-center gap-[12px]">

<dialog id="issue_modal" class="modal modal-bottom sm:modal-middle ">
    <div class="modal-box bg-white max-w-[700px]">
